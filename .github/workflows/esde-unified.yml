name: ES-DE General Engine Integration Contract
on:
  push:
    branches:
      - integration/fullstack-gow-got-20261019
    paths:
      - tools/development/esde_unified.sh
      - tools/development/esde_general_engine_source_merge_20261019.py
      - tools/development/esde_general_semantic_resolver_20261019.py
      - tools/development/esde_general_late_semantic_resolver_20261020.py
      - documents/ESDE_GENERAL_SOURCE_INTEGRATION_20261019.md
      - .github/workflows/esde-unified.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-source-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax of new general integration entry point
        run: |
          bash -n tools/development/esde_unified.sh
          python3 -m py_compile tools/development/esde_general_engine_source_merge_20261019.py tools/development/esde_general_semantic_resolver_20261019.py tools/development/esde_general_late_semantic_resolver_20261020.py
      - name: Offline general source merge nonregression
        run: python3 -B tools/development/esde_general_engine_source_merge_20261019.py --self-test
      - name: Reconciler SHA source fixture contract
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path("tools/development/esde_general_semantic_resolver_20261019.py")
          spec=importlib.util.spec_from_file_location("resolver",p)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert len(mod.REVIEWED)==9
          assert sum(item[2] for item in mod.REVIEWED.values())==39
          assert all(len(item[0])==len(item[1])==64 for item in mod.REVIEWED.values())
          assert mod.resolve_reviewed("unverified.cpp",b"left\n=======\nright") is None
          print("NINE_FILE_GENERAL_RECONCILIATION_CONTRACT=PASS")
          print("HOST_ARCHIVE_FIXTURE=CHECKED_WHEN_PRESENT_ON_USER_SERVER")
          PY
      - name: Later generic shader/Vulkan merge review integrity
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path("tools/development/esde_general_late_semantic_resolver_20261020.py")
          spec=importlib.util.spec_from_file_location("late",p)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert len(mod.CASES)==21
          assert all(len(pairs)==2 and all(len(h)==64 for h in pairs)
                     for pairs in mod.CASES.values())
          assert mod.resolve("not-a-commit","not-a-file",b"") is None
          assert not any("b18cfc312904" in key for key in mod.CASES)
          print("LATER_REVIEWED_SOURCE_HUNKS=PASS count=21")
          print("UNPROVEN_TEXTURE_SLOT_PRESSURE_OPT_IN=NOT_PROMOTED")
          PY
      - name: Exact upstream / GPU source pin audit
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path=Path("tools/development/esde_general_engine_source_merge_20261019.py")
          tree=ast.parse(path.read_text())
          values={}
          for node in tree.body:
              if isinstance(node,ast.Assign):
                  for dst in node.targets:
                      if isinstance(dst,ast.Name) and dst.id in {
                          "UPSTREAM", "UPSTREAM_REVIEWED", "GOW", "GOT",
                          "GOT_LATE", "COMMON", "GENERAL_LATE_COMMITS"
                      }:
                          values[dst.id]=ast.literal_eval(node.value)
          assert values["UPSTREAM"]=="d615b3887ba29025a59242e1a26f5b68bb176158"
          assert values["UPSTREAM_REVIEWED"]=="a808e7626e3c7de8d0f0fda6a91f620b42f6c762"
          assert len(values["GENERAL_LATE_COMMITS"])==83
          assert len(values["GENERAL_LATE_COMMITS"])==len(set(values["GENERAL_LATE_COMMITS"]))
          assert all(len(s)==12 for s in values["GENERAL_LATE_COMMITS"])
          assert len({values["GOW"],values["GOT"],values["GOT_LATE"],values["COMMON"]})==4
          print("PINNED_GENERAL_ENGINE_SOURCE_CONTRACT=PASS")
          print("HOST_GAMEPLAY_VERIFICATION=NOT_RUN_BY_CI")
          PY
      - name: Review gate
        run: |
          echo "The CI job verifies source/merge policy only."
          echo "Host-specific AMD/ROCm build and PS4 gameplay acceptance require Linux test host."
          echo "No ES-DE release or default executable is selected here."
