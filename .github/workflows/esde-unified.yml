name: ES-DE General Engine Integration Contract
on:
  push:
    branches:
      - integration/fullstack-gow-got-20261019
    paths:
      - tools/development/esde_unified.sh
      - tools/development/esde_general_engine_source_merge_20261019.py
      - documents/ESDE_GENERAL_SOURCE_INTEGRATION_20261019.md
      - .github/workflows/esde-unified.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-source-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax of new general integration entry point
        run: |
          bash -n tools/development/esde_unified.sh
          python3 -m py_compile tools/development/esde_general_engine_source_merge_20261019.py
      - name: Offline general source merge nonregression
        run: python3 -B tools/development/esde_general_engine_source_merge_20261019.py --self-test
      - name: Exact upstream / GPU source pin audit
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path=Path("tools/development/esde_general_engine_source_merge_20261019.py")
          tree=ast.parse(path.read_text())
          values={}
          for node in tree.body:
              if isinstance(node,ast.Assign):
                  for dst in node.targets:
                      if isinstance(dst,ast.Name) and dst.id in {
                          "UPSTREAM", "UPSTREAM_REVIEWED", "GOW", "GOT",
                          "GOT_LATE", "COMMON", "GENERAL_LATE_COMMITS"
                      }:
                          values[dst.id]=ast.literal_eval(node.value)
          assert values["UPSTREAM"]=="d615b3887ba29025a59242e1a26f5b68bb176158"
          assert values["UPSTREAM_REVIEWED"]=="f68923fe807f657348e6719ce658bcbd0a2b1c72"
          assert len(values["GENERAL_LATE_COMMITS"])==84
          assert len(values["GENERAL_LATE_COMMITS"])==len(set(values["GENERAL_LATE_COMMITS"]))
          assert all(len(s)==12 for s in values["GENERAL_LATE_COMMITS"])
          assert len({values["GOW"],values["GOT"],values["GOT_LATE"],values["COMMON"]})==4
          print("PINNED_GENERAL_ENGINE_SOURCE_CONTRACT=PASS")
          print("HOST_GAMEPLAY_VERIFICATION=NOT_RUN_BY_CI")
          PY
      - name: Review gate
        run: |
          echo "The CI job verifies source/merge policy only."
          echo "Host-specific AMD/ROCm build and PS4 gameplay acceptance require Linux test host."
          echo "No ES-DE release or default executable is selected here."
