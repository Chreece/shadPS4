name: Readback fence candidate Linux validation
on:
  push:
    branches:
      - fix/relaxed-readback-fence-tracking-20261006
    paths:
      - src/**
      - tests/standalone/readback_fence_test.py
      - .github/workflows/readback-fence-candidate.yml
permissions:
  contents: read
jobs:
  linux-gcc14:
    if: github.repository == 'Chreece/shadPS4'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-14 g++-14 mold build-essential cmake pkg-config libx11-dev libxext-dev libwayland-dev libdecor-0-dev libxkbcommon-dev libglfw3-dev libgles2-mesa-dev libasound2-dev libpulse-dev libopenal-dev libudev-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxrandr-dev libxfixes-dev
      - name: Test committed tracker classes
        run: |
          python3 tests/standalone/readback_fence_test.py 2>&1 | tee tracker-tests.log
          python3 tests/standalone/readback_fence_test.py --sanitize 2>&1 | tee tracker-sanitizers.log
          git diff --exit-code
      - name: Configure full emulator
        run: |
          cmake -S . -B build-readback-candidate -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=OFF -DCMAKE_C_COMPILER=/usr/bin/gcc-14 -DCMAKE_CXX_COMPILER=/usr/bin/g++-14 -DCMAKE_ASM_COMPILER=/usr/bin/gcc-14 -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=mold -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=OFF 2>&1 | tee configure.log
      - name: Build full emulator
        run: |
          cmake --build build-readback-candidate --parallel 2 2>&1 | tee build.log
          test -x build-readback-candidate/shadps4
          sha256sum build-readback-candidate/shadps4 | tee binary.sha256
          git rev-parse HEAD | tee candidate-commit.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: readback-fence-linux-validation
          path: |
            tracker-tests.log
            tracker-sanitizers.log
            configure.log
            build.log
            binary.sha256
            candidate-commit.txt
