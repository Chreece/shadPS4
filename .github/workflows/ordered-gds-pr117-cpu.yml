name: Ordered GDS CPU reference (PR 117)

on:
  push:
    branches:
      - feature/ordered-gds-wave-executor-20261029
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ordered-gds-cpu:
    name: CPU contracts - ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify C++23 compiler
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          command -v "$CXX"
          "$CXX" --version
          printf 'int main() { return 0; }\n' | "$CXX" -std=c++23 -x c++ -fsyntax-only -
      - name: Run actual typed IR, frontend, ordered batches and continuation tests
        env:
          CXX: ${{ matrix.compiler }}
          RUN_SANITIZERS: '1'
        run: |
          set -euo pipefail
          bash tests/run_ordered_gds_cpu.sh
      - name: Enforce that GPU execution is still gated
        run: |
          set -euo pipefail
          grep -q 'ASSERT_MSG(!program.info.uses_ordered_gds' src/shader_recompiler/backend/spirv/emit_spirv.cpp
          grep -q 'UNREACHABLE_MSG(' src/shader_recompiler/backend/spirv/emit_spirv.cpp
          echo 'ORDERED_GDS_GPU_BACKEND=NOT_IMPLEMENTED; NO_GPU_OR_GAME_RUN'
