name: Validate Guest CPU Playtest Helper

on:
  push:
    branches:
      - playtest/guest-cpu-clean-deploy-20261005
    paths:
      - "documents/install_guest_cpu_clean_playtest.py"
      - ".github/workflows/validate-guest-cpu-helper.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Compile helper
        run: python3 -m py_compile documents/install_guest_cpu_clean_playtest.py
      - name: Verify pinned candidate and safe checkout ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("documents/install_guest_cpu_clean_playtest.py")
          text = path.read_text()

          assert 'BRANCH = "kernel/current-cpu-affinity-upstream-20261005"' in text
          assert 'REVISION = "360f8dc64799743b8ea9831637e2c07bbc79a210"' in text
          assert 'shadps4_kernel_cpu_test' in text
          assert 'UNIT_TESTS=PASS' in text
          assert 'SCOPE=UPSTREAM_MAIN_PLUS_GUEST_CPU_ONLY' in text
          assert 'tests_folder = work / "build-tests"' in text
          assert 'app_folder = work / "build-app"' in text
          assert '"-DENABLE_TESTS=ON"' in text
          assert '"-DENABLE_TESTS=OFF"' in text
          tests_build = text.index('"cmake", "--build", tests_folder')
          app_config = text.index('"cmake", "-S", source, "-B", app_folder')
          app_build = text.index('"cmake", "--build", app_folder, "--target", "shadps4"')
          assert tests_build < app_config < app_build

          checkout = text.index('run(["git", "-C", source, "checkout", "--detach", "--force", REVISION])')
          status = text.index('dirty = subprocess.check_output(', checkout)
          assert checkout < status
          assert "os.exec" not in text
          PY
