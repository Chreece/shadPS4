name: PES diagnostic self-test

on:
  push:
    branches: [ci/pes-diagnostic-selftest]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  window-action:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build disposable X11 fixture
        run: |
          docker build -t pes-window-fixture -f - scripts <<'DOCKERFILE'
          FROM debian:trixie-slim
          RUN apt-get update && apt-get install -y --no-install-recommends python3 libx11-6 xvfb openbox && rm -rf /var/lib/apt/lists/*
          COPY show_pes_window.py trace_video_progress.py test_show_pes_window.py /test/
          ENV HOME=/tmp PES_WINDOW_X11_TEST=1
          WORKDIR /test
          CMD ["python3", "-u", "test_show_pes_window.py"]
          DOCKERFILE
      - name: Verify focus, minimization, workspaces, and exact process selection
        run: >-
          timeout --signal=TERM --kill-after=5s 60s docker run --rm --network none --read-only
          --tmpfs /tmp:rw,exec,size=128m --cap-drop ALL
          --security-opt no-new-privileges --pids-limit 64
          --memory 256m --cpus 1 pes-window-fixture
  frame-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check diagnostic decoding, deadlines, and launch gates
        run: >-
          python3 -m unittest -v
          test_trace_video_progress test_validate_video_diagnostic
          test_pes_frame_diagnostic test_run_pes_startup_test
          test_collect_pes_runtime_context
      - name: Build and run disposable Debian GDB fixtures in Docker
        run: |
          python3 -u - <<'PY'
          import validate_video_diagnostic as validate
          validate.launch(profile="frames")
          PY
      - name: Preserve GDB evidence even when validation fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pes-frame-selftest-evidence
          path: ~/shadps4-pes-selftest-*/selftest-evidence.tar.gz
          if-no-files-found: warn
          retention-days: 14
