          assert "record_stride,record_offset,indexed_limit" in s
          assert "(limits.maxPerStageResources-total_reserve)/2u-1u" in s
          assert "PAIRED_DESCRIPTOR_TOTAL_RESOURCE_LIMIT_MISSING" in s
          assert "AnalyzeIndexedSamplerTable" in s
          assert "sampler_array_sizes" in s
          assert "LoadIndexedGuestSampler" in s
          assert "TextureDefinition" in s
          assert "ImageDefinition" in s
          assert "SPIRV_TEXTURE_DEFINITION_STRUCT_NOT_FOUND" in s
          assert "INVALID_SPIRV_SAMPLER_ARRAY_CAPABILITY_RETAINED" in s
          assert "INDEXED_SAMPLER_BINDING_CONTRACT_MISSING" in s
          assert "sampler.NumBindings(*stage)" in s
          assert "sampler.NumBindings(*info)" in s
          assert "INTEGER_SAMPLER_EXTRA_TRANSFORM_MISSING" in s
          assert "538fc65527d96086443d14d3227eb9c5daa7397f" in s
          assert "cbbcc969156f9258633914409ca88e6458bbad2c" in s
          assert "clean-rebase-verified" not in s
          assert "rglob('build.ninja')" not in s
          assert "def builddir(" not in s
          assert "def apply_range_file(" not in s
          assert "def apply_patch_commit(" not in s
          assert "def _pure_cache_version_patch(" not in s
          assert "PATCH_PATHS" not in s
          assert "replayed_generic_commits':[]" in s
          assert "CACHE_VERSION_NOT_SINGLE_BUMP" in s
          assert "cache_versions_single_bump" in s
          assert "GENERIC_BASE_TRANSFORM_MISSING" in s
          assert "INTEGER_SAMPLER_EXTRA_TRANSFORM_MISSING" in s
          assert "for p in EXTRA_FILES:" in s
          print("COMPOSER_STATIC_CHECK=PASS")
          PY
      - name: Validate recovered verified-parent artifact
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          parts=[
              Path(f"patches/verified-975.patch.gz.b64.part{i:02d}")
              for i in range(1,9)
          ]
          for p in parts:
              assert p.is_file() and p.stat().st_size > 0, p
          encoded=b"".join(p.read_bytes().strip() for p in parts)
          raw=base64.b64decode(encoded, validate=True)
          assert raw[:2] == b"\x1f\x8b"
          patch=gzip.decompress(raw)
          assert patch.startswith(b"diff --git ")
          assert b"src/shader_recompiler/" in patch
          assert b"src/video_core/" in patch
          assert patch.count(b"diff --git ") >= 5
          print("RECOVERED_PARENT_BUNDLE=PASS", len(patch))
          PY
