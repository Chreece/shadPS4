name: Generic indexed composer checks
on:
  push:
    branches:
      - fix/generic-large-indexed-images-20261023
    paths:
      - scripts/build_run_generic_large_indexed_resources_20261023.py
      - .github/workflows/generic-large-indexed-composer-check.yml
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate composer syntax and safety invariants
        run: |
          python3 -m py_compile scripts/build_run_generic_large_indexed_resources_20261023.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p=Path("scripts/build_run_generic_large_indexed_resources_20261023.py")
          s=p.read_text()
          tree=ast.parse(s)
          funcs={n.name for n in tree.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))}
          assigns={
              n.targets[0].id: ast.literal_eval(n.value)
              for n in tree.body
              if isinstance(n,ast.Assign)
              and len(n.targets)==1
              and isinstance(n.targets[0],ast.Name)
              and n.targets[0].id in {"PATCH_COMMITS","VULKAN_INDEXING_FEATURE_FIXES"}
          }
          assert len(assigns["PATCH_COMMITS"]) == 31
          assert "cbbcc969156f9258633914409ca88e6458bbad2c" not in assigns["PATCH_COMMITS"]
          assert "538fc65527d96086443d14d3227eb9c5daa7397f" not in assigns["PATCH_COMMITS"]
          assert assigns["VULKAN_INDEXING_FEATURE_FIXES"] == (
              "cbbcc969156f9258633914409ca88e6458bbad2c",
              "538fc65527d96086443d14d3227eb9c5daa7397f",
          )
          for name in ("compose","verify_prev","fresh_paths","apply_patch_commit","finish_generic_large","launch","main"):
              assert name in funcs, name
          assert "GhostOfTsushima/source" in s
          assert "clean-rebase-verified/source" not in s
          assert "def builddir():" not in s
          assert "'-DENABLE_TESTS=OFF'" in s
          assert "GOT_SOURCE_REPOSITORY_MISSING" in s
          assert "def add_fresh_source(" in s
          assert "FRESH_SOURCE_COMPOSER_REF_FETCH_FAILED" in s
          assert "refs/remotes/composer/candidate" in s
          assert "DISCOVER_LOOP_API_NOT_ADAPTED" in s
          assert "MarkReadConstBufferSharpSources(usage.indexed_table_sharp);" in s
          assert "def remove_fresh_source(" in s
          assert "def submodules_at(" in s
          assert "clone\',\'--no-hardlinks\',\'--no-checkout" in s
          assert "def commit_tree(" in s
          assert "parser.add_argument('--launch'" in s
          assert "BUILD_ONLY_PASS=YES" in s
          assert "def ensure_required_refs(" in s
          assert "def recovered_parent_ref(" in s
          assert "RECOVERY_PARTS" in s
          assert "base64.b64decode" in s
          assert "gzip.decompress" in s
          assert "RECOVERED_PARENT_TREE_NOT_REPRODUCED" in s
          assert "PARENT_TREE='d921f3f51c546aa8b9dfe7e230aaefeaf0b3c446'" in s
          assert "SOURCE_REMOTE='https://github.com/Chreece/shadPS4.git'" in s
          assert "UPSTREAM_REMOTE='https://github.com/shadps4-emu/shadPS4.git'" in s
          assert "UPSTREAM_MAIN='91e6afa69b0a64b0afaa0281b80f8fbb0cd88136'" in s
          assert "def merge_verified_parent_with_upstream(" in s
          assert "'merge-tree','--write-tree'" in s
          assert "UPSTREAM_MERGE_CONFLICT" in s
          assert "UPSTREAM_MERGE_PARENTAGE_MISMATCH" in s
          assert "ctx.OpBitcast(ctx.S32[1], raw)" in s
          assert "ctx.OpBitcast(ctx.S32[2], raw)" in s
          assert "ctx.OpBitcast(ctx.S32[3], raw)" in s
          assert "def instance_cpp(" in s
          assert "GUEST_TSHARP_FINAL='02c22fd61253b072a9bc4017e67f9c39fa0d4fa9'" in s
          assert "FINAL_GUEST_TSHARP_HELPER_MISSING" in s
          assert "if p in (" in s
          assert "indexed_image_selector.h" in s
          assert "guest_tsharp_array.h" in s
          assert "INSTANCE_DYNAMIC_INDEX" in s
          assert "INSTANCE_NONUNIFORM_INDEX" in s
          assert "INVALID_VULKAN_SAMPLER_NONUNIFORM_FEATURE_RETAINED" in s
          assert "PATCH_COMMIT_NOT_SINGLE_FILE" in s
          assert "PATCH_COMMIT_OUTSIDE_GENERIC_SOURCE" in s
          assert "538fc65527d96086443d14d3227eb9c5daa7397f" in s
          assert "cbbcc969156f9258633914409ca88e6458bbad2c" in s
          assert "clean-rebase-verified" not in s
          assert "rglob('build.ninja')" not in s
          assert "def builddir(" not in s
          print("COMPOSER_STATIC_CHECK=PASS")
          PY
      - name: Validate recovered verified-parent artifact
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          parts=[
              Path(f"patches/verified-975.patch.gz.b64.part{i:02d}")
              for i in range(1,9)
          ]
          for p in parts:
              assert p.is_file() and p.stat().st_size > 0, p
          encoded=b"".join(p.read_bytes().strip() for p in parts)
          raw=base64.b64decode(encoded, validate=True)
          assert raw[:2] == b"\x1f\x8b"
          patch=gzip.decompress(raw)
          assert patch.startswith(b"diff --git ")
          assert b"src/shader_recompiler/" in patch
          assert b"src/video_core/" in patch
          assert patch.count(b"diff --git ") >= 5
          print("RECOVERED_PARENT_BUNDLE=PASS", len(patch))
          PY
